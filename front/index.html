<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Azalea</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: transparent !important;
      }
      canvas {
        background-color: transparent !important;
        display: block;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.185.1/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OutlineEffect } from "three/addons/effects/OutlineEffect.js";

      let mixer;
      let currentAction;
      let model;
      const pendingTransform = {
        scale: null,
        rotation: null,
        position: null,
      };
      const actions = {};
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 2, 3);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.domElement.style.touchAction = "none";
      document.body.appendChild(renderer.domElement);

      const effect = new OutlineEffect(renderer, {
        defaultThickness: 0.0015,
        defaultColor: [0.2, 0.1, 0.1],
        defaultAlpha: 1.0,
      });

      const dragState = {
        active: false,
        pointerId: null,
      };

      function getScreenCoordinates(event) {
        return {
          x: Math.round(window.screenX + event.clientX),
          y: Math.round(window.screenY + event.clientY),
        };
      }

      function sendDragCommand(command, event) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          return;
        }

        const { x, y } = getScreenCoordinates(event);
        ws.send(
          JSON.stringify({
            command,
            screen_x: x,
            screen_y: y,
          }),
        );
      }

      function handlePointerDown(event) {
        if (event.button !== 0) {
          return;
        }

        if (!isPointOnModel(event.clientX, event.clientY)) {
          dragState.active = false;
          dragState.pointerId = null;
          return;
        }

        event.preventDefault();
        dragState.active = true;
        dragState.pointerId = event.pointerId ?? null;
        if (event.pointerId != null) {
          renderer.domElement.setPointerCapture(event.pointerId);
        }
        sendDragCommand("start_drag", event);
      }

      function handlePointerMove(event) {
        if (!dragState.active) {
          return;
        }

        event.preventDefault();
        sendDragCommand("drag_move", event);
      }

      function handlePointerUp(event) {
        if (!dragState.active) {
          return;
        }

        event.preventDefault();
        dragState.active = false;
        if (
          event.pointerId != null &&
          dragState.pointerId === event.pointerId
        ) {
          renderer.domElement.releasePointerCapture(event.pointerId);
          dragState.pointerId = null;
        }
        sendDragCommand("end_drag", event);
      }

      const pointerEventNames = [
        ["pointerdown", handlePointerDown],
        ["pointermove", handlePointerMove],
        ["pointerup", handlePointerUp],
        [
          "pointercancel",
          () => {
            dragState.active = false;
            dragState.pointerId = null;
          },
        ],
        ["mousedown", handlePointerDown],
        ["mousemove", handlePointerMove],
        ["mouseup", handlePointerUp],
      ];

      pointerEventNames.forEach(([name, handler]) => {
        renderer.domElement.addEventListener(name, handler);
      });

      // 光照默认值：与 /render_config 返回的 configs/config.json 3dmodel.light
      // 保持一致，仅作为请求失败时的兜底（fail-safe fallback）。
      const DEFAULT_LIGHT_CONFIG = {
        directional_intensity: 1.4,
        ambient_intensity: 0.9,
        ambient_warmth: 35,
      };
      // 环境光暖色：0 = 中性白，100 = 暖橙（按 ambient_warmth 在两者间插值）
      const LIGHT_COLOR_NEUTRAL = new THREE.Color(0xffffff);
      const LIGHT_COLOR_WARM = new THREE.Color(0xffb347);

      function computeAmbientColor(warmthPct) {
        const t = Math.min(1, Math.max(0, Number(warmthPct) / 100));
        return LIGHT_COLOR_NEUTRAL.clone().lerp(LIGHT_COLOR_WARM, t);
      }

      const ambientLight = new THREE.AmbientLight(
        computeAmbientColor(DEFAULT_LIGHT_CONFIG.ambient_warmth),
        DEFAULT_LIGHT_CONFIG.ambient_intensity,
      );
      scene.add(ambientLight);

      // 模拟从右上方打来的主光源（方向由固定位置决定，位置本身不可配置，
      // 可配置的只有强度——见 applyLightConfig）
      const dirLight = new THREE.DirectionalLight(
        0xffffff,
        DEFAULT_LIGHT_CONFIG.directional_intensity,
      );
      dirLight.position.set(1.5, 2.0, 1.0);
      scene.add(dirLight);

      // 调试用全局句柄：模块作用域对 DevTools/远程调试不可见，
      // 通过 window.azalea 暴露场景对象便于线上排查渲染问题
      window.azalea = {
        scene,
        ambientLight,
        dirLight,
        get model() {
          return model;
        },
      };

      function applyLightConfig(cfg) {
        if (!cfg) return;
        if (typeof cfg.directional_intensity === "number") {
          dirLight.intensity = cfg.directional_intensity;
        }
        if (typeof cfg.ambient_intensity === "number") {
          ambientLight.intensity = cfg.ambient_intensity;
        }
        if (typeof cfg.ambient_warmth === "number") {
          ambientLight.color.copy(computeAmbientColor(cfg.ambient_warmth));
        }
      }

      // 启动时从服务端拉取持久化的光照配置；请求失败时保留上面的默认值
      fetch("/render_config")
        .then((r) => (r.ok ? r.json() : null))
        .then((data) => {
          if (data && data.light) applyLightConfig(data.light);
        })
        .catch(() => {});

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      const format = renderer.capabilities.isWebGL2
        ? THREE.RedFormat
        : THREE.LuminanceFormat;
      const colors = new Uint8Array([120, 200, 255]);
      const gradientMap = new THREE.DataTexture(
        colors,
        colors.length,
        1,
        format,
      );
      gradientMap.needsUpdate = true;
      gradientMap.magFilter = THREE.NearestFilter;
      gradientMap.minFilter = THREE.NearestFilter;

      const loader = new GLTFLoader();
      loader.load("./model.glb", function (gltf) {
        model = gltf.scene;
        model.scale.set(2.6, 2.6, 2.6);
        model.rotation.y = Math.PI / 2;

        model.traverse((child) => {
          if (child.isMesh) {
            const materials = Array.isArray(child.material)
              ? child.material
              : [child.material];

            const toonMaterials = materials.map((mat) => {
              const toonMat = new THREE.MeshToonMaterial({
                color: mat.color,
                map: mat.map,
                normalMap: mat.normalMap,
                alphaMap: mat.alphaMap,
                alphaTest: mat.alphaTest,
                transparent: mat.transparent,
                side: mat.side,
                gradientMap: gradientMap,
                emissive: mat.emissive,
                emissiveMap: mat.emissiveMap,
                emissiveIntensity: mat.emissiveIntensity,
              });
              toonMat.name = mat.name;

              if (mat.name === "Mouth") {
                // 根因（已用 CDP 逐项排查确认，不是深度测试/遮挡/光照/朝向/
                // frustum culling 问题——这些单独或组合测试过全都无效）：
                // 在本机的软件 GL（Mesa/llvmpipe，日志里 Vulkan 初始化失败
                // 已经暴露了这个环境是纯软件渲染）上，GLTFLoader 把解码出的
                // ImageBitmap 直接交给 WebGL 上传后，这张贴图在 GPU 侧整体
                // 采样结果是全透明——即使贴图本身的像素数据是对的（离线用
                // PIL 和浏览器端 canvas 回读都验证过，嘴形在正确的 UV 区域
                // 里，alpha 有效值高达 255）。用一个 2D canvas 把同样的图像
                // 重新画一遍再包成 CanvasTexture，走的是另一条上传路径，
                // 绕开了这个平台特定的贴图上传问题。
                if (mat.map && mat.map.image) {
                  const srcImg = mat.map.image;
                  const canvas = document.createElement("canvas");
                  canvas.width = srcImg.width;
                  canvas.height = srcImg.height;
                  const ctx = canvas.getContext("2d");
                  ctx.drawImage(srcImg, 0, 0);
                  const canvasTex = new THREE.CanvasTexture(canvas);
                  canvasTex.flipY = mat.map.flipY;
                  canvasTex.colorSpace = mat.map.colorSpace;
                  canvasTex.needsUpdate = true;
                  toonMat.map = canvasTex;
                }

                // 嘴部还是与脸部共面的透明贴片（decal），保留深度写入/多边形
                // 偏移调整以避免和脸部之间出现 z-fighting 闪烁。
                toonMat.transparent = true;
                toonMat.depthWrite = false;
                toonMat.polygonOffset = true;
                toonMat.polygonOffsetFactor = -2;
                toonMat.polygonOffsetUnits = -2;
                child.renderOrder = 1;
                // 嘴部贴图是 8x8 精灵图集，游戏引擎在运行时用 UV 偏移选择
                // 口型；GLB 导出把 UV 冻结在图集空白处，所以嘴不可见。
                // 这里把采样窗口平移到一个自然的默认口型上
                if (toonMat.map) {
                  toonMat.map = toonMat.map.clone();
                  // (0.125, 0) = 图集第 2 列同一行：张口微笑（开心表情）。
                  // (0.125, 0.25) 是惊讶张嘴，(0.375/0.5, 0) 是"o"型嘴
                  toonMat.map.offset.set(0.125, 0.0);
                  toonMat.map.needsUpdate = true;
                }
              }

              let outlineColorArray = [0.2, 0.1, 0.1];
              if (mat.color) {
                const darkerColor = mat.color.clone().multiplyScalar(0.15);

                const isGray =
                  Math.abs(darkerColor.r - darkerColor.g) < 0.05 &&
                  Math.abs(darkerColor.g - darkerColor.b) < 0.05;
                if (isGray) {
                  darkerColor.lerp(new THREE.Color(0.25, 0.15, 0.15), 0.5);
                }

                outlineColorArray = darkerColor.toArray();
              }

              toonMat.userData.outlineParameters = {
                color: outlineColorArray,
              };

              return toonMat;
            });

            child.material =
              toonMaterials.length === 1 ? toonMaterials[0] : toonMaterials;
          }
        });

        scene.add(model);

        mixer = new THREE.AnimationMixer(model);

        gltf.animations.forEach((clip) => {
          actions[clip.name] = mixer.clipAction(clip);
        });

        const defaultClip =
          "CH0069_Cafe_Idle" in actions
            ? actions["CH0069_Cafe_Idle"].getClip()
            : gltf.animations[0];
        if (defaultClip) {
          currentAction = actions[defaultClip.name];
          currentAction.play();
        }

        console.log("可用动画列表:", Object.keys(actions));
        window.THREE_DEBUG = {
          actions: actions,
          mixer: mixer,
          getCurrentAction: () => currentAction,
          switchAnimation: switchAnimation,
          scene: scene,
          model: model,
        };
        console.log(
          'window.THREE_DEBUG.switchAnimation("CH0069_Cafe_Idle", true);',
        );
        applyPendingTransform();
      });

      function switchAnimation(animName, loop = true, fadeDuration = 0.2) {
        if (actions) {
          if (!actions[animName]) {
            console.warn(`找不到动画: ${animName}`);
            return;
          }

          const newAction = actions[animName];
          const oldAction = currentAction;
          if (oldAction === newAction) return;

          newAction.reset();
          newAction.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce);
          if (!loop) newAction.clampWhenFinished = true;
          newAction.setEffectiveTimeScale(1);
          newAction.setEffectiveWeight(1);

          if (oldAction) {
            if (fadeDuration > 0) {
              oldAction.crossFadeTo(newAction, fadeDuration, false);
            } else {
              oldAction.stop();
            }
          }

          newAction.play();
          currentAction = newAction;
        }
      }

      function applyPendingTransform() {
        if (!model) {
          return;
        }

        if (pendingTransform.scale) {
          model.scale.set(
            pendingTransform.scale.x,
            pendingTransform.scale.y,
            pendingTransform.scale.z,
          );
        }

        if (pendingTransform.rotation) {
          const rotationUnits = pendingTransform.rotation.units || "degrees";
          const rotationFactor =
            rotationUnits === "degrees" ? THREE.MathUtils.DEG2RAD : 1;
          model.rotation.set(
            pendingTransform.rotation.x * rotationFactor,
            pendingTransform.rotation.y * rotationFactor,
            pendingTransform.rotation.z * rotationFactor,
          );
        }

        if (pendingTransform.position) {
          model.position.set(
            pendingTransform.position.x,
            pendingTransform.position.y,
            pendingTransform.position.z,
          );
        }
      }

      function updateModelTransform(transform) {
        if (transform.scale) {
          pendingTransform.scale = transform.scale;
        }

        if (transform.rotation) {
          pendingTransform.rotation = {
            ...transform.rotation,
            units: transform.rotation_units || "degrees",
          };
        }

        if (transform.position) {
          pendingTransform.position = transform.position;
        }

        applyPendingTransform();
      }

      function updateCameraPosition(position) {
        if (position) {
          camera.position.set(position.x, position.y, position.z);
        }
      }

      function isPointOnModel(x, y) {
        if (!model) {
          return false;
        }

        mouse.x = (x / window.innerWidth) * 2 - 1;
        mouse.y = -(y / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        return raycaster.intersectObject(model, true).length > 0;
      }

      const wsUrl = "{{ ws_url }}";
      const ws = new WebSocket(wsUrl);

      ws.onmessage = function (event) {
        const data = JSON.parse(event.data);
        if (data.command === "play_anim") {
          const fadeDuration =
            data.fade_duration !== undefined ? data.fade_duration : 0.2;
          switchAnimation(data.anim_name, data.loop, fadeDuration);
        } else if (data.command === "set_transform") {
          updateModelTransform(data);
        } else if (data.command === "set_camera") {
          updateCameraPosition(data.position);
        } else if (data.command === "set_light") {
          applyLightConfig(data);
        } else if (data.command === "hit_test") {
          const hoveringModel = isPointOnModel(data.x, data.y);
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({
                command: "set_click_through",
                enabled: !hoveringModel,
                x: data.x,
                y: data.y,
              }),
            );
          }
        }
      };

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        effect.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>

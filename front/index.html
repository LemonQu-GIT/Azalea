<!-- index.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Azalea</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: transparent !important;
      }
      canvas {
        background-color: transparent !important;
        display: block;
      }

      /* ============================================================
         Debug transform panel (only shown via console enableDebugMode)
         ============================================================ */
      #az-debug-panel {
        position: fixed;
        top: 16px;
        right: 16px;
        width: 300px;
        padding: 12px 14px 14px;
        background: rgba(22, 27, 34, 0.88);
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 10px;
        backdrop-filter: blur(6px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", sans-serif;
        font-size: 12px;
        z-index: 99999;
        user-select: none;
      }
      #az-debug-panel .az-panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
        padding-bottom: 8px;
        border-bottom: 1px solid #30363d;
      }
      #az-debug-panel .az-panel-title span {
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.3px;
      }
      #az-debug-panel .az-close-btn {
        cursor: pointer;
        border: none;
        background: #21262d;
        color: #e6edf3;
        width: 22px;
        height: 22px;
        line-height: 1;
        border-radius: 6px;
        font-size: 14px;
      }
      #az-debug-panel .az-close-btn:hover {
        background: #30363d;
        color: #ff7b72;
      }
      #az-debug-panel .az-section-title {
        font-weight: 600;
        margin: 10px 0 6px;
        color: #8b949e;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      #az-debug-panel .az-row {
        display: grid;
        grid-template-columns: 26px 1fr 64px;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      #az-debug-panel .az-axis {
        font-weight: 700;
        text-align: center;
        padding: 2px 0;
        border-radius: 4px;
        font-size: 11px;
      }
      #az-debug-panel .az-axis.x { background: rgba(255, 107, 107, 0.2); color: #ff7b72; }
      #az-debug-panel .az-axis.y { background: rgba(63, 185, 80, 0.18);  color: #3fb950; }
      #az-debug-panel .az-axis.z { background: rgba(83, 155, 245, 0.2);  color: #58a6ff; }

      #az-debug-panel input[type="range"] {
        width: 100%;
        accent-color: #58a6ff;
      }
      #az-debug-panel input[type="number"] {
        width: 100%;
        box-sizing: border-box;
        background: #0d1117;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 5px;
        padding: 3px 5px;
        font-size: 11px;
        text-align: right;
      }
      #az-debug-panel input[type="number"]:focus {
        outline: none;
        border-color: #58a6ff;
      }
      #az-debug-panel .az-reset-row {
        display: flex;
        gap: 6px;
        margin-top: 10px;
      }
      #az-debug-panel .az-reset-row button {
        flex: 1;
        background: #21262d;
        color: #e6edf3;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 5px 6px;
        cursor: pointer;
        font-size: 11px;
      }
      #az-debug-panel .az-reset-row button:hover {
        background: #30363d;
        border-color: #58a6ff;
      }
    </style>
  </head>
  <body>
    <script type="importmap">
      {
        "imports": {
          "three": "./three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.1/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from "three";
      import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
      import { OutlineEffect } from "three/addons/effects/OutlineEffect.js";

      let mixer;
      let currentAction;
      let model;
      const pendingTransform = {
        scale: null,
        rotation: null,
        rotation_orientation: null,
        position: null,
      };

      // --- Debug Mode state (HTML slider panel, no gizmos) ---
      const debug = {
        enabled: false,
        panel: null,         // HTML panel element
        controls: {},        // { position_x: { slider, number }, ... }
        writingUI: false,    // true when we push model state values into the UI
        uiInteracting: false,// true while the user is dragging a slider / typing in an input
        uiInteractTimer: null,
        // Per-axis accumulated "logical" rotation angles shown in the UI (degrees).
        // These are the authoritative source for rotation slider UI: they
        // represent how much the user (or UI code) has *requested* each axis
        // to rotate. We never back-solve a quaternion back into these values
        // (that would cause gimbal-jitter), but instead accumulate deltas
        // directly from slider motion and apply them as quaternion multiplies.
        uiAnglesDeg: { x: 0, y: 0, z: 0 },
        lastSyncAt: 0,       // throttle model→UI sync in requestAnimationFrame
      };

      const actions = {};
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(
        75,
        window.innerWidth / window.innerHeight,
        0.1,
        1000,
      );
      camera.position.set(0, 2, 3);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.domElement.style.touchAction = "none";
      document.body.appendChild(renderer.domElement);

      const effect = new OutlineEffect(renderer, {
        defaultThickness: 0.0015,
        defaultColor: [0.2, 0.1, 0.1],
        defaultAlpha: 1.0,
      });

      const dragState = {
        active: false,
        pointerId: null,
      };

      function getScreenCoordinates(event) {
        return {
          x: Math.round(window.screenX + event.clientX),
          y: Math.round(window.screenY + event.clientY),
        };
      }

      function sendDragCommand(command, event) {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
          return;
        }

        const { x, y } = getScreenCoordinates(event);
        ws.send(
          JSON.stringify({
            command,
            screen_x: x,
            screen_y: y,
          }),
        );
      }

      function handlePointerDown(event) {
        if (event.button !== 0) {
          return;
        }

        if (!isPointOnModel(event.clientX, event.clientY)) {
          dragState.active = false;
          dragState.pointerId = null;
          return;
        }

        event.preventDefault();
        dragState.active = true;
        dragState.pointerId = event.pointerId ?? null;
        if (event.pointerId != null) {
          renderer.domElement.setPointerCapture(event.pointerId);
        }
        sendDragCommand("start_drag", event);
      }

      function handlePointerMove(event) {
        if (!dragState.active) {
          return;
        }

        event.preventDefault();
        sendDragCommand("drag_move", event);
      }

      function handlePointerUp(event) {
        if (!dragState.active) {
          return;
        }

        event.preventDefault();
        dragState.active = false;
        if (
          event.pointerId != null &&
          dragState.pointerId === event.pointerId
        ) {
          renderer.domElement.releasePointerCapture(event.pointerId);
          dragState.pointerId = null;
        }
        sendDragCommand("end_drag", event);
      }

      const pointerEventNames = [
        ["pointerdown", handlePointerDown],
        ["pointermove", handlePointerMove],
        ["pointerup", handlePointerUp],
        [
          "pointercancel",
          () => {
            dragState.active = false;
            dragState.pointerId = null;
          },
        ],
        ["mousedown", handlePointerDown],
        ["mousemove", handlePointerMove],
        ["mouseup", handlePointerUp],
      ];

      pointerEventNames.forEach(([name, handler]) => {
        renderer.domElement.addEventListener(name, handler);
      });

      scene.add(new THREE.AmbientLight(0xffffff, 1.8));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);

      dirLight.position.set(2, 5, 5);
      scene.add(dirLight);

      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      const format = renderer.capabilities.isWebGL2
        ? THREE.RedFormat
        : THREE.LuminanceFormat;
      const colors = new Uint8Array([120, 200, 255]);
      const gradientMap = new THREE.DataTexture(
        colors,
        colors.length,
        1,
        format,
      );
      gradientMap.needsUpdate = true;
      gradientMap.magFilter = THREE.NearestFilter;
      gradientMap.minFilter = THREE.NearestFilter;

      const loader = new GLTFLoader();
      loader.load("./model.glb", function (gltf) {
        model = gltf.scene;
        model.scale.set(2.6, 2.6, 2.6);
        model.rotation.y = Math.PI / 2;

        model.traverse((child) => {
          if (child.isMesh) {
            const materials = Array.isArray(child.material)
              ? child.material
              : [child.material];

            const toonMaterials = materials.map((mat) => {
              const toonMat = new THREE.MeshToonMaterial({
                color: mat.color,
                map: mat.map,
                normalMap: mat.normalMap,
                alphaMap: mat.alphaMap,
                alphaTest: mat.alphaTest,
                transparent: mat.transparent,
                side: mat.side,
                gradientMap: gradientMap,
                emissive: mat.emissive,
                emissiveMap: mat.emissiveMap,
                emissiveIntensity: mat.emissiveIntensity,
              });

              let outlineColorArray = [0.2, 0.1, 0.1];
              if (mat.color) {
                const darkerColor = mat.color.clone().multiplyScalar(0.15);

                const isGray =
                  Math.abs(darkerColor.r - darkerColor.g) < 0.05 &&
                  Math.abs(darkerColor.g - darkerColor.b) < 0.05;
                if (isGray) {
                  darkerColor.lerp(new THREE.Color(0.25, 0.15, 0.15), 0.5);
                }

                outlineColorArray = darkerColor.toArray();
              }

              toonMat.userData.outlineParameters = {
                color: outlineColorArray,
              };

              return toonMat;
            });

            child.material =
              toonMaterials.length === 1 ? toonMaterials[0] : toonMaterials;
          }
        });

        scene.add(model);

        mixer = new THREE.AnimationMixer(model);

        gltf.animations.forEach((clip) => {
          actions[clip.name] = mixer.clipAction(clip);
        });

        const defaultClip =
          "CH0069_Cafe_Idle" in actions
            ? actions["CH0069_Cafe_Idle"].getClip()
            : gltf.animations[0];
        if (defaultClip) {
          currentAction = actions[defaultClip.name];
          currentAction.play();
        }

        console.log("可用动画列表:", Object.keys(actions));
        window.THREE_DEBUG = {
          actions: actions,
          mixer: mixer,
          getCurrentAction: () => currentAction,
          switchAnimation: switchAnimation,
        };
        console.log(
          'window.THREE_DEBUG.switchAnimation("CH0069_Cafe_Idle", true);',
        );
        applyPendingTransform();
      });

      function switchAnimation(animName, loop = true, fadeDuration = 0.2) {
        if (actions) {
          if (!actions[animName]) {
            console.warn(`找不到动画: ${animName}`);
            return;
          }

          const newAction = actions[animName];
          const oldAction = currentAction;
          if (oldAction === newAction) return;

          newAction.reset();
          newAction.setLoop(loop ? THREE.LoopRepeat : THREE.LoopOnce);
          if (!loop) newAction.clampWhenFinished = true;
          newAction.setEffectiveTimeScale(1);
          newAction.setEffectiveWeight(1);

          if (oldAction) {
            if (fadeDuration > 0) {
              oldAction.crossFadeTo(newAction, fadeDuration, false);
            } else {
              oldAction.stop();
            }
          }

          newAction.play();
          currentAction = newAction;
        }
      }

      function applyPendingTransform() {
        if (!model) {
          return;
        }

        if (pendingTransform.scale) {
          model.scale.set(
            pendingTransform.scale.x,
            pendingTransform.scale.y,
            pendingTransform.scale.z,
          );
        }

        if (pendingTransform.rotation) {
          const rotationUnits = pendingTransform.rotation.units || "degrees";
          const rotationFactor =
            rotationUnits === "degrees" ? THREE.MathUtils.DEG2RAD : 1;
          const orientation = pendingTransform.rotation_orientation || "local";

          const rx = pendingTransform.rotation.x * rotationFactor;
          const ry = pendingTransform.rotation.y * rotationFactor;
          const rz = pendingTransform.rotation.z * rotationFactor;

          if (orientation === "global") {
            const worldEuler = new THREE.Euler(rx, ry, rz, "XYZ");
            const worldQuat = new THREE.Quaternion().setFromEuler(worldEuler);

            if (model.parent) {
              const parentWorldQuat = new THREE.Quaternion();
              model.parent.getWorldQuaternion(parentWorldQuat);
              const invParentQuat = parentWorldQuat.clone().invert();
              model.quaternion.copy(invParentQuat.multiply(worldQuat));
            } else {
              model.quaternion.copy(worldQuat);
            }
          } else {
            model.rotation.set(rx, ry, rz);
          }
        }

        if (pendingTransform.position) {
          model.position.set(
            pendingTransform.position.x,
            pendingTransform.position.y,
            pendingTransform.position.z,
          );
        }
      }

      function updateModelTransform(transform) {
        if (transform.scale) {
          pendingTransform.scale = transform.scale;
        }

        if (transform.rotation) {
          pendingTransform.rotation = {
            ...transform.rotation,
            units: transform.rotation_units || "degrees",
          };
          pendingTransform.rotation_orientation =
            transform.rotation_orientation || "local";
        }

        if (transform.position) {
          pendingTransform.position = transform.position;
        }

        applyPendingTransform();
      }

      function updateCameraPosition(position) {
        if (position) {
          camera.position.set(position.x, position.y, position.z);
        }
      }

      function isPointOnModel(x, y) {
        if (!model) {
          return false;
        }

        mouse.x = (x / window.innerWidth) * 2 - 1;
        mouse.y = -(y / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);
        return raycaster.intersectObject(model, true).length > 0;
      }

      // ============================================================
      // Debug Mode — HTML 6-slider panel (position XYZ + rotation XYZ)
      // ============================================================

      function printModelTransform() {
        if (!model) {
          console.warn("模型尚未加载");
          return;
        }

        const pos = model.position;
        const eulerLocal = new THREE.Euler().setFromQuaternion(
          model.quaternion,
          "XYZ",
        );

        const worldPos = new THREE.Vector3();
        model.getWorldPosition(worldPos);
        const worldQuat = new THREE.Quaternion();
        model.getWorldQuaternion(worldQuat);
        const eulerWorld = new THREE.Euler().setFromQuaternion(
          worldQuat,
          "XYZ",
        );

        const fmt = (v) => v.toFixed(3);
        const fmtDeg = (rad) =>
          (THREE.MathUtils.RAD2DEG * rad).toFixed(3);

        const info = {
          position_local: { x: fmt(pos.x), y: fmt(pos.y), z: fmt(pos.z) },
          position_world: {
            x: fmt(worldPos.x),
            y: fmt(worldPos.y),
            z: fmt(worldPos.z),
          },
          rotation_local_Euler_deg: {
            x: fmtDeg(eulerLocal.x),
            y: fmtDeg(eulerLocal.y),
            z: fmtDeg(eulerLocal.z),
          },
          rotation_world_Euler_deg: {
            x: fmtDeg(eulerWorld.x),
            y: fmtDeg(eulerWorld.y),
            z: fmtDeg(eulerWorld.z),
          },
          quaternion_local: {
            x: fmt(model.quaternion.x),
            y: fmt(model.quaternion.y),
            z: fmt(model.quaternion.z),
            w: fmt(model.quaternion.w),
          },
          scale: {
            x: fmt(model.scale.x),
            y: fmt(model.scale.y),
            z: fmt(model.scale.z),
          },
        };
        console.log("=== 模型 Transform ===");
        console.table(info);
        return info;
      }

      // Write the panel's current slider/number values into the model.
      //
      // Rotation is handled as per-axis delta-quaternion multiplies against
      // the model's existing quaternion (NOT by writing Euler angles). This
      // means:
      //   - No gimbal-lock induced jitter on the OTHER two axes while you drag
      //     one axis.
      //   - The UI's "logical" angle (debug.uiAnglesDeg) is preserved so the
      //     sliders stay exactly where the user put them.
      function writeTransformFromUI(changedAxis) {
        if (!model) return;
        const c = debug.controls;
        const position = {
          x: Number(c.position_x.slider.value),
          y: Number(c.position_y.slider.value),
          z: Number(c.position_z.slider.value),
        };

        // --- Position: always direct write ---
        pendingTransform.position = { ...position };
        model.position.set(position.x, position.y, position.z);

        // --- Rotation: delta quaternion, ONLY for the axis that moved ---
        // We don't touch the other two axes' state; quaternion composition
        // keeps them unchanged. This is the key fix for "dragging one axis
        // makes the other two axes constantly rewrite themselves".
        let rotationDirty = false;
        (["x", "y", "z"]).forEach((axis) => {
          const key = `rotation_${axis}`;
          if (!(key in c)) return;
          const newDeg = Number(c[key].slider.value);
          const oldDeg = debug.uiAnglesDeg[axis];
          const deltaDeg = newDeg - oldDeg;
          if (deltaDeg === 0) return;

          debug.uiAnglesDeg[axis] = newDeg;
          const deltaRad = deltaDeg * THREE.MathUtils.DEG2RAD;
          const q = new THREE.Quaternion();
          switch (axis) {
            case "x": q.setFromAxisAngle(new THREE.Vector3(1, 0, 0), deltaRad); break;
            case "y": q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), deltaRad); break;
            case "z": q.setFromAxisAngle(new THREE.Vector3(0, 0, 1), deltaRad); break;
          }
          model.quaternion.premultiply(q);
          rotationDirty = true;
        });

        if (rotationDirty) {
          // Also write the latest "logical" Euler-ish degree values back into
          // pendingTransform for the same single-source-of-truth semantic that
          // the web-socket set_transform command uses.
          pendingTransform.rotation = {
            x: debug.uiAnglesDeg.x,
            y: debug.uiAnglesDeg.y,
            z: debug.uiAnglesDeg.z,
            units: "degrees",
          };
          pendingTransform.rotation_orientation = "local";
        }
      }

      // Mark the UI as being interacted with; animate() skips model→UI sync
      // while this flag is true so user drags aren't overwritten.
      function markUIInteracting() {
        debug.uiInteracting = true;
        if (debug.uiInteractTimer) clearTimeout(debug.uiInteractTimer);
        // Release lock 250ms after the last user interaction, so downstream
        // set_transform messages can reflect in the UI again.
        debug.uiInteractTimer = setTimeout(() => {
          debug.uiInteracting = false;
        }, 250);
      }

      // Push model state into UI inputs.
      //
      // Position: always synced (no ambiguity).
      // Rotation: synced ONLY when the user isn't interacting AND the model's
      // actual rotation diverges significantly from what the logical UI
      // angles would produce. This avoids reintroducing gimbal jitter while
      // still letting back-end set_transform calls drive the sliders.
      function syncUIFromModel() {
        if (!model || !debug.enabled || !debug.panel) return;
        if (debug.uiInteracting) return; // user is dragging → don't overwrite

        const c = debug.controls;
        debug.writingUI = true;
        try {
          // Position (always fresh and non-ambiguous)
          const px = +model.position.x.toFixed(3);
          const py = +model.position.y.toFixed(3);
          const pz = +model.position.z.toFixed(3);
          c.position_x.slider.value  = px;
          c.position_x.number.value  = px;
          c.position_y.slider.value  = py;
          c.position_y.number.value  = py;
          c.position_z.slider.value  = pz;
          c.position_z.number.value  = pz;

          // Rotation:
          // Compute the quaternion that the CURRENT logical UI angles would
          // produce, and compare against the model's real quaternion. If
          // they're close, leave the UI alone (prevents Euler-backsolve jitter).
          // If they're far apart (e.g. backend set_transform / animation moved
          // the model), re-initialize UI angles from a ONE-TIME backsolve and
          // trust that as the new "logical" baseline.
          const expectedQ = new THREE.Quaternion();
          expectedQ.setFromEuler(new THREE.Euler(
            debug.uiAnglesDeg.x * THREE.MathUtils.DEG2RAD,
            debug.uiAnglesDeg.y * THREE.MathUtils.DEG2RAD,
            debug.uiAnglesDeg.z * THREE.MathUtils.DEG2RAD,
            "XYZ",
          ));
          const dot = Math.abs(model.quaternion.dot(expectedQ));
          const DIVERGED = 0.999; // ~2.5° of drift or more

          if (dot < DIVERGED) {
            const e = new THREE.Euler().setFromQuaternion(model.quaternion, "XYZ");
            const rx = +(THREE.MathUtils.RAD2DEG * e.x).toFixed(2);
            const ry = +(THREE.MathUtils.RAD2DEG * e.y).toFixed(2);
            const rz = +(THREE.MathUtils.RAD2DEG * e.z).toFixed(2);
            debug.uiAnglesDeg.x = rx;
            debug.uiAnglesDeg.y = ry;
            debug.uiAnglesDeg.z = rz;
            c.rotation_x.slider.value  = rx;
            c.rotation_x.number.value  = rx;
            c.rotation_y.slider.value  = ry;
            c.rotation_y.number.value  = ry;
            c.rotation_z.slider.value  = rz;
            c.rotation_z.number.value  = rz;
          } else {
            // No meaningful drift → keep the UI slider values exactly as the
            // user left them (no Euler backsolve → no cross-axis jitter).
            const ax = +debug.uiAnglesDeg.x.toFixed(2);
            const ay = +debug.uiAnglesDeg.y.toFixed(2);
            const az = +debug.uiAnglesDeg.z.toFixed(2);
            if (c.rotation_x.slider.value != ax) { c.rotation_x.slider.value = ax; c.rotation_x.number.value = ax; }
            if (c.rotation_y.slider.value != ay) { c.rotation_y.slider.value = ay; c.rotation_y.number.value = ay; }
            if (c.rotation_z.slider.value != az) { c.rotation_z.slider.value = az; c.rotation_z.number.value = az; }
          }
        } finally {
          debug.writingUI = false;
        }
      }

      function makeSliderRow({
        key, axisLabel, axisClass, label,
        min, max, step, initial,
        axisKey,            // optional "x" | "y" | "z" for logical angle
        isRotation = false,
      }) {
        const wrap = document.createElement("div");
        wrap.className = "az-row";

        const axis = document.createElement("div");
        axis.className = `az-axis ${axisClass}`;
        axis.textContent = axisLabel;
        axis.title = label;

        const slider = document.createElement("input");
        slider.type = "range";
        slider.min = String(min);
        slider.max = String(max);
        slider.step = String(step);
        slider.value = String(initial);

        const number = document.createElement("input");
        number.type = "number";
        // For rotation allow dragging past ±360 → don't cap number.min/max
        // to the slider range (user can type bigger values if they want).
        if (!isRotation) {
          number.min = String(min);
          number.max = String(max);
        }
        number.step = String(step);
        number.value = String(initial);

        wrap.appendChild(axis);
        wrap.appendChild(slider);
        wrap.appendChild(number);

        // Bi-directional linking between slider <-> number + apply to model
        function applyFromSlider() {
          markUIInteracting();
          number.value = slider.value;
          if (!debug.writingUI) {
            writeTransformFromUI(axisKey);
          }
        }
        function applyFromNumber() {
          markUIInteracting();
          slider.value = number.value;
          if (!debug.writingUI) {
            writeTransformFromUI(axisKey);
          }
        }
        slider.addEventListener("input",  applyFromSlider);
        slider.addEventListener("pointerdown", markUIInteracting);
        slider.addEventListener("mousedown",   markUIInteracting);
        number.addEventListener("input",  applyFromNumber);
        number.addEventListener("pointerdown", markUIInteracting);
        number.addEventListener("mousedown",   markUIInteracting);
        number.addEventListener("keydown",     markUIInteracting);

        // Prevent interaction on the debug panel from triggering window-drag
        [slider, number].forEach((el) => {
          el.addEventListener("pointerdown", (ev) => {
            dragState.active = false;
            ev.stopPropagation();
          });
          el.addEventListener("mousedown", (ev) => ev.stopPropagation());
        });

        debug.controls[key] = { slider, number };
        return wrap;
      }

      function createDebugPanel() {
        const panel = document.createElement("div");
        panel.id = "az-debug-panel";

        // Header
        const header = document.createElement("div");
        header.className = "az-panel-title";
        const title = document.createElement("span");
        title.textContent = "Transform 调试面板";
        const closeBtn = document.createElement("button");
        closeBtn.className = "az-close-btn";
        closeBtn.innerHTML = "&times;";
        closeBtn.title = "关闭面板（等同于调用 disableDebugMode()）";
        closeBtn.addEventListener("click", () => disableDebugMode());
        header.appendChild(title);
        header.appendChild(closeBtn);
        panel.appendChild(header);

        // -- Seed initial values from what currently exists --
        const defaults = (() => {
          if (model) {
            const e = new THREE.Euler().setFromQuaternion(model.quaternion, "XYZ");
            const rx = +(THREE.MathUtils.RAD2DEG * e.x).toFixed(2);
            const ry = +(THREE.MathUtils.RAD2DEG * e.y).toFixed(2);
            const rz = +(THREE.MathUtils.RAD2DEG * e.z).toFixed(2);
            return {
              px: +model.position.x.toFixed(3),
              py: +model.position.y.toFixed(3),
              pz: +model.position.z.toFixed(3),
              rx, ry, rz,
            };
          }
          return { px: 0, py: 0, pz: 0, rx: 0, ry: 90, rz: 0 };
        })();
        // Initialize the logical rotation angles from the one-time Euler
        // backsolve (before any user interaction begins).
        debug.uiAnglesDeg.x = defaults.rx;
        debug.uiAnglesDeg.y = defaults.ry;
        debug.uiAnglesDeg.z = defaults.rz;

        // Position section
        const posTitle = document.createElement("div");
        posTitle.className = "az-section-title";
        posTitle.textContent = "Position (局部位置)";
        panel.appendChild(posTitle);

        panel.appendChild(makeSliderRow({
          key: "position_x", axisLabel: "X", axisClass: "x",
          label: "Position X", min: -10, max: 10, step: 0.01, initial: defaults.px,
          axisKey: "x", isRotation: false,
        }));
        panel.appendChild(makeSliderRow({
          key: "position_y", axisLabel: "Y", axisClass: "y",
          label: "Position Y", min: -10, max: 10, step: 0.01, initial: defaults.py,
          axisKey: "y", isRotation: false,
        }));
        panel.appendChild(makeSliderRow({
          key: "position_z", axisLabel: "Z", axisClass: "z",
          label: "Position Z", min: -10, max: 10, step: 0.01, initial: defaults.pz,
          axisKey: "z", isRotation: false,
        }));

        // Rotation section
        const rotTitle = document.createElement("div");
        rotTitle.className = "az-section-title";
        rotTitle.textContent = "Rotation (局部四元数增量 · 度)";
        panel.appendChild(rotTitle);

        // Rotation sliders go -360° → +360°. Combined with the "logical
        // angle accumulator" semantics the user can drag continuously.
        panel.appendChild(makeSliderRow({
          key: "rotation_x", axisLabel: "X", axisClass: "x",
          label: "绕局部 X 轴旋转 (度)",
          min: -360, max: 360, step: 0.5,
          initial: defaults.rx,
          axisKey: "x", isRotation: true,
        }));
        panel.appendChild(makeSliderRow({
          key: "rotation_y", axisLabel: "Y", axisClass: "y",
          label: "绕局部 Y 轴旋转 (度)",
          min: -360, max: 360, step: 0.5,
          initial: defaults.ry,
          axisKey: "y", isRotation: true,
        }));
        panel.appendChild(makeSliderRow({
          key: "rotation_z", axisLabel: "Z", axisClass: "z",
          label: "绕局部 Z 轴旋转 (度)",
          min: -360, max: 360, step: 0.5,
          initial: defaults.rz,
          axisKey: "z", isRotation: true,
        }));

        // Reset buttons
        const btnRow = document.createElement("div");
        btnRow.className = "az-reset-row";

        const resetPos = document.createElement("button");
        resetPos.textContent = "重置位置";
        resetPos.addEventListener("click", () => {
          const c = debug.controls;
          c.position_x.slider.value = 0; c.position_x.number.value = 0;
          c.position_y.slider.value = 0; c.position_y.number.value = 0;
          c.position_z.slider.value = 0; c.position_z.number.value = 0;
          writeTransformFromUI(null);
        });

        const resetRot = document.createElement("button");
        resetRot.textContent = "重置旋转";
        resetRot.addEventListener("click", () => {
          const c = debug.controls;
          // Reset both the logical angles AND the model's quaternion back
          // to the known-good default (Y=90°) for this asset.
          debug.uiAnglesDeg.x = 0;
          debug.uiAnglesDeg.y = 90;
          debug.uiAnglesDeg.z = 0;
          model.quaternion.setFromEuler(new THREE.Euler(
            0,
            THREE.MathUtils.DEG2RAD * 90,
            0,
            "XYZ",
          ));
          c.rotation_x.slider.value = 0;  c.rotation_x.number.value = 0;
          c.rotation_y.slider.value = 90; c.rotation_y.number.value = 90;
          c.rotation_z.slider.value = 0;  c.rotation_z.number.value = 0;
          pendingTransform.rotation = {
            x: 0, y: 90, z: 0, units: "degrees",
          };
          pendingTransform.rotation_orientation = "local";
        });

        const printBtn = document.createElement("button");
        printBtn.textContent = "打印数据";
        printBtn.addEventListener("click", () => printModelTransform());

        btnRow.appendChild(resetPos);
        btnRow.appendChild(resetRot);
        btnRow.appendChild(printBtn);
        panel.appendChild(btnRow);

        // Block pointer events inside the panel from propagating to canvas
        panel.addEventListener("pointerdown", (e) => e.stopPropagation());
        panel.addEventListener("pointermove", (e) => e.stopPropagation());
        panel.addEventListener("pointerup",   (e) => e.stopPropagation());
        panel.addEventListener("mousedown",   (e) => e.stopPropagation());
        panel.addEventListener("mousemove",   (e) => e.stopPropagation());
        panel.addEventListener("mouseup",     (e) => e.stopPropagation());

        document.body.appendChild(panel);
        return panel;
      }

      function enableDebugMode() {
        if (debug.enabled) {
          console.log("✔ Debug mode 已启用");
          return;
        }
        debug.enabled = true;
        debug.panel = createDebugPanel();

        // If model loads after enableDebugMode(), sync once it appears.
        if (model) syncUIFromModel();

        console.log(
          "%c Debug mode 已启用 %c\n" +
            "  右上角浮窗：6 条滑块分别控制 Position X/Y/Z + Rotation X/Y/Z (度)\n" +
            "  可拖动滑块，或直接在右侧数字框里输入数值\n" +
            "  可用命令: printModelTransform() / disableDebugMode()",
          "background:#4a9eff;color:white;padding:2px 6px;border-radius:4px;",
          "",
        );
        printModelTransform();
      }

      function disableDebugMode() {
        if (!debug.enabled) return;
        debug.enabled = false;
        if (debug.panel && debug.panel.parentNode) {
          debug.panel.parentNode.removeChild(debug.panel);
        }
        debug.panel = null;
        debug.controls = {};
        console.log("Debug mode 已关闭");
      }

      // Expose console-only API
      window.enableDebugMode  = enableDebugMode;
      window.disableDebugMode = disableDebugMode;
      window.printModelTransform = printModelTransform;

      // Also expose module-internal state for debug inspection
      window.DEBUG = {
        get debug() { return debug; },
        get model() { return model; },
        scene,
        camera,
        renderer,
        effect,
      };

      const wsUrl = "{{ ws_url }}";
      const ws = new WebSocket(wsUrl);

      ws.onmessage = function (event) {
        const data = JSON.parse(event.data);
        if (data.command === "play_anim") {
          const fadeDuration =
            data.fade_duration !== undefined ? data.fade_duration : 0.2;
          switchAnimation(data.anim_name, data.loop, fadeDuration);
        } else if (data.command === "set_transform") {
          updateModelTransform(data);
        } else if (data.command === "set_camera") {
          updateCameraPosition(data.position);
        } else if (data.command === "hit_test") {
          const hoveringModel = isPointOnModel(data.x, data.y);
          if (ws.readyState === WebSocket.OPEN) {
            ws.send(
              JSON.stringify({
                command: "set_click_through",
                enabled: !hoveringModel,
                x: data.x,
                y: data.y,
              }),
            );
          }
        }
      };

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta();
        if (mixer) mixer.update(delta);

        // Keep debug panel values synced with the model over time.
        // Throttled to ~160ms max, and completely skipped while the user is
        // actively interacting with sliders (prevents animate() from fighting
        // the user's drag and clamping the slider mid-drag).
        if (debug.enabled && !debug.uiInteracting && !debug.writingUI && model) {
          const now = performance.now();
          if (now - debug.lastSyncAt > 160) {
            syncUIFromModel();
            debug.lastSyncAt = now;
          }
        }

        effect.render(scene, camera);
      }
      animate();

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    </script>
  </body>
</html>
